name: Render Visualizer Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and rclone
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Configure rclone from secret
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Generate sample audio and waveform visualizer MP4
        run: |
          mkdir -p /tmp/aasma_render
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=6" -c:a aac -b:a 128k /tmp/aasma_render/sample.m4a
          ffmpeg -y -i /tmp/aasma_render/sample.m4a -filter_complex "[0:a]showwaves=s=1280x720:mode=cline:colors=00e5ff:rate=30,format=yuv420p[v]" -map "[v]" -map 0:a -c:v libx264 -preset veryfast -crf 23 -c:a aac -shortest /tmp/aasma_render/aasma_wave_test.mp4

      - name: Upload rendered video safely to Google Drive (no delete)
        run: |
          rclone copy /tmp/aasma_render/aasma_wave_test.mp4 aasma_cloud:Aasma-Music-Visualizer/renders/
          rclone ls aasma_cloud:Aasma-Music-Visualizer/renders/
