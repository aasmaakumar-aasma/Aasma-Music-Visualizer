name: Render Direct MP3

on:
  workflow_dispatch:
  push:
    paths:
      - 'input_audio/*.mp3'
      - 'input_audio/*.m4a'
      - 'input_audio/*.wav'
      - 'input_photo/*'

permissions:
  contents: read

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg, rclone, advanced fonts & Python libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone fonts-lato fonts-dejavu-core fonts-noto-cjk python3-pip
          pip install --break-system-packages google-genai pillow rembg onnxruntime numpy

      - name: Configure rclone from secret
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Render Cinematic Pro Studio MP4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p /tmp/aasma_out
          AUDIO_FILE=$(ls -t input_audio/* | head -n 1)
          BASE_NAME=$(basename "${AUDIO_FILE%.*}")
          python3 render_lyrics.py "$AUDIO_FILE" "/tmp/aasma_out/${BASE_NAME}_cinematic_v3.mp4"

      - name: Upload video safely to Google Drive
        run: |
          rclone copy /tmp/aasma_out/ aasma_cloud:Aasma-Music-Visualizer/renders/
          rclone ls aasma_cloud:Aasma-Music-Visualizer/renders/
